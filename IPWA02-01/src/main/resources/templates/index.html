<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shea Sepherd: Ghost Net Fishing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen p-6">
    <header class="flex justify-between items-center mb-6 pb-4">
        <h1 class="text-3xl font-bold">Übersicht</h1>
        <form action="/" method="get" id="filterForm" class="flex items-center gap-2 px-3 py-2">
            <input type="checkbox" id="showAll" name="showAll" value="true" th:checked="${showAll}"
            onchange="document.getElementById('filterForm').submit()" class="w-4 h-4">
            <label for="showAll" class="text-sm">Alle Netze anzeigen (inkl. geborgen/verschollen)</label>
        </form>
        <a href="/report">Netz melden</a>
    </header>
</body>
<table class="min-w-full leading-normal">
    <thead>
        <tr class="bg-gray-800 text-white text-sm leading-normal">
            <th class="py-3 px-6 text-left">ID</th>
            <th class="py-3 px-6 text-left">Standort</th>
            <th class="py-3 px-6 text-left">Größe (m²)</th>
            <th class="py-3 px-6 text-left">Status</th>
            <th class="py-3 px-6 text-left">Bergende Person</th>
            <th class="py-3 px-6 text-left">Aktionen</th>
        </tr>
    </thead>
    <tbody class="text-sm font-light">
        <tr th:if="${nets.empty}">
            <td colspan="6" class="py-6 text-center">Aktuell keine Geisternetze erfasst.</td>
        </tr>
        <tr th:each="net : ${nets}" class="hover:bg-gray-50">
            <td th:text="${net.id}" class="py-3 px-6 text-left">0</td>
            <td th:text="${net.latitude + ' / ' + net.longitude}" class="py-3 px-6 text-left">0 / 0</td>
            <td th:text="${net.estimatedSize}" class="py-3 px-6 text-left">0</td>
            <td class="py-3 px-6 text-left">
                <span class="bg-yellow-200 text-yellow-800" th:if="${net.status.name() == 'GEMELDET'}">Gemeldet</span>
                <span class="bg-blue-200 text-blue-800" th:if="${net.status.name() == 'BERGUNG_BEVORSTEHEND'}">Bergung bevorstehend</span>
            </td>
            <td th:text="${net.rescuer != null ? net.rescuer.name + ' (' + net.rescuer.phoneNumber + ')' : '-'}" class="py-3 px-6 text-left">-</td>
            <td class="py-3 px-6 text-left">
                <a th:if="${net.status.name() == 'GEMELDET'}"
                   th:href="@{'/assign/' + ${net.id}}"
                   class="bg-green-600 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-xs transition inline-block">
                    Bergung übernehmen
                </a>
                <form th:if="${net.status.name() == 'BERGUNG_BEVORSTEHEND'}" action="/rescued" method="post" class="inline-block mr-1">
                    <input type="hidden" name="netId" th:value="${net.id}"/>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-xs transition">
                        Als geborgen markieren
                    </button>
                </form>
                <a th:if="${net.status.name() == 'GEMELDET' || net.status.name() == 'BERGUNG_BEVORSTEHEND'}"
                   th:href="@{'/missing/' + ${net.id}}"
                   class="bg-red-100 hover:bg-red-200 text-red-700 font-medium py-1 px-2 rounded text-xs transition border border-red-300 inline-block">
                    Verschollen
                </a>
                <span th:if="${net.status.name() == 'GEBORGEN' || net.status.name() == 'VERSCHOLLEN'}" class="text-xs text-gray-400 italic">Keine Aktion möglich</span>
            </td>
        </tr>
    </tbody>
</table>
</html>
